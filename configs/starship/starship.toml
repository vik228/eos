format = "$username$hostname$directory$git_branch$git_status$python$nodejs$cmd_duration\n$character"
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext = "#a6adc8"

[username]
show_always = true
style_user = "bold lavender"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold subtext"
format = "[@$hostname]($style) "

[directory]
style = "bold teal"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"

[git_branch]
symbol = "git:"
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "[$all_status$ahead_behind]($style) "

[python]
symbol = "py "
style = "bold yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "bold green"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 750
style = "bold red"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
