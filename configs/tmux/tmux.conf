set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -g xterm-keys on
set -s extended-keys on
set -g allow-passthrough on
set -g visual-activity off
set-option -g focus-events on
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:extkeys,wezterm:extkeys,tmux-256color:extkeys"

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind z resize-pane -Z

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi

set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 120
set -g status-style "bg=colour236,fg=colour248"
set -g status-left "#[bold,fg=colour110] #S "
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "
setw -g window-status-current-style "bold,fg=colour159"
