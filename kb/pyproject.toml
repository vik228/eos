[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eos-kb"
version = "0.1.0"
description = "Local EOS knowledge base CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
kb = "eos_kb.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false
